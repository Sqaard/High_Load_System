services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"  # External access to nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Mount custom config
    depends_on:
      predict-server:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"] #make sure nginx is runnning
      interval: 10s
      timeout: 5s
      retries: 3

  k6:
    image: grafana/k6:latest
    command: run /scripts/pg_load.js --verbose
    volumes:
      - ./tests:/scripts
    depends_on:
    - postgres-master
    - postgres-exporter

  vanukov-site:
    build: ./vanukov-site
    ports:
      - "80:5173"
    volumes:
      - ./vanukov-site:/app
      - /app/node_modules
    depends_on:
      simulator:
        condition: service_healthy
      predict-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 3

  predict-server:
    build: ./predict-server
    ports:
      - "5002:5002"
    volumes:
      - ./predict-server:/app
    expose:
      - "5002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:  # Vertical scaling
      resources:
        limits:
          cpus: '0.5'  # Limit to 0.5 CPU cores
          memory: 256M  # Limit to 256MB memory

  simulator:
    build: ./simulator
    # Comment for horizontal scaling
    #ports:
    #  - "5001:5001"
    #  - "8000:8000" # For /metrics
    volumes:
      - ./simulator:/app
    expose:
      - "5001"
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '0.5'     # Low CPU – forces horizontal scaling to shine
          memory: 256M    # Low memory – same as predict-server

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      predict-server:
        condition: service_healthy
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=grafana_password
      - GF_DATABASE_SSL_MODE=disable
    depends_on:
      prometheus:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=grafana_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://grafana:grafana_password@postgres:5432/grafana?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    
  etcd:
    image: quay.io/coreos/etcd:v3.3.27
    container_name: etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      ETCD_NAME: etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster
    volumes:
      - etcd-data:/var/lib/etcd
    restart: unless-stopped

  db-api:
    build: ./db-api  # see Dockerfile below
    container_name: db-api
    ports:
      - "5003:5003"  # HTTP for k6
    volumes:
      - ./db-api:/app
    environment:
      MASTER_DSN: postgresql://grafana:grafana_password@postgres-master:5432/grafana?sslmode=disable
      REPLICA_DSN: postgresql://grafana:grafana_password@postgres-replica:5432/grafana?sslmode=disable
    depends_on:
      - postgres-master
      - postgres-replica
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    restart: unless-stopped
  postgres-master:
    image: ghcr.io/zalando/spilo-16:3.3-p1
    container_name: postgres-master
    ports:
      - "5433:5432"
      - "8008:8008"  # Patroni REST API
    environment:
      SCOPE: postgres-cluster
      NAME: master
      ETCD_HOSTS: etcd:2379
      PGUSER: grafana
      PGPASSWORD: grafana_password
      SUPERUSER_PASSWORD: admin_password
      REPLICATION_USER: repl_user
      REPLICATION_PASSWORD: repl_password
      PGDATA: /var/lib/postgresql/data
      PATRONI_LOG_LEVEL: DEBUG   # ← add this
      PATRONI_CONFIG: /home/postgres/patroni.yml
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./patroni.yml:/home/postgres/patroni.yml:ro

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "grafana"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: ghcr.io/zalando/spilo-16:3.3-p1
    container_name: postgres-replica
    ports:
      - "5434:5432"
      - "8009:8008"
    environment:
      SCOPE: postgres-cluster
      NAME: replica
      ETCD_HOSTS: etcd:2379
      PGUSER: grafana
      PGPASSWORD: grafana_password
      SUPERUSER_PASSWORD: admin_password
      REPLICATION_USER: repl_user
      REPLICATION_PASSWORD: repl_password
      PGDATA: /var/lib/postgresql/data
      PATRONI_LOG_LEVEL: DEBUG   # ← add this
      PATRONI_CONFIG: /home/postgres/patroni.yml
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./patroni.yml:/home/postgres/patroni.yml:ro

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "grafana"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Add postgres-exporter for both
  postgres-exporter-master:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-master
    environment:
      DATA_SOURCE_NAME: "postgresql://grafana:grafana_password@postgres-master:5432/grafana?sslmode=disable"
    ports:
      - "9188:9187"
    depends_on:
      - postgres-master

  postgres-exporter-replica:
    image: prometheuscommunity/postgres-exporter
    container_name: postgres-exporter-replica
    environment:
      DATA_SOURCE_NAME: "postgresql://grafana:grafana_password@postgres-replica:5432/grafana?sslmode=disable"
    ports:
      - "9189:9187"
    depends_on:
      - postgres-replica

  # For huge insert — I'll use psql in k6 
volumes:
  etcd-data:
  prometheus-data:
  grafana-data:
  postgres-data:
  postgres-master-data:
  postgres-replica-data:
events {
    worker_connections 4096;     
    multi_accept on;            
}

worker_processes auto;

http {
    upstream predict_backend {
        server predict-server:5002;
    }

    upstream simulator_backend {
        server simulator:5001;     # ← Use the service name (not simulator-1 etc.)
        keepalive 32;
    }

    server {
        listen 80;

        location /predict {
            proxy_pass http://predict_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws/ {
            proxy_pass http://simulator_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}